<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Calulator</title>
</head>
<body>
    <h2>Hello World</h2>

    <div class="calculatorBody">
        <div class="display">Display here</div>
        <div class="container">
            <div class="numberButtons">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>0</div>
            </div>
            <div class="operationButtons">
                <div>+</div>
                <div>-</div>
                <div>*</div>
                <div>/</div>
                <div>=</div>
            </div>
        </div>
    </div>

   







    <script src="script.js"></script>
    
</body>
</html>
