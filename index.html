<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Calulator</title>
    <link rel="stylesheet" href="styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sekuya&family=VT323&display=swap" rel="stylesheet">
<body>
    <h2>Calculator project</h2>

    <div class="calculatorBody">
        <div class="display">Enter some Numbers</div>
        <div class="container">
            <div class="topRow">
                <button class="btn" id="clear">AC</button>
                <button class="btn"id="delete">Del</button>
                <button class="btn"id="divide">/</button>
            </div>
            <div class="row1">
                <button class="btn" id="seven">7</button>
                <button class="btn" id="eight">8</button>
                <button class="btn" id="nine">9</button>
                <button class="btn" id="multiply">*</button>
    
            </div>
            <div class="row2">
                <button class="btn" id="four">4</button>
                <button class="btn" id="five">5</button>
                <button class="btn" id="six">6</button>
                <button class="btn" id="subtract">-</button>
            </div>
            <div class="row3">
                <button class="btn" id="one">1</button>
                <button class="btn" id="two">2</button>
                <button class="btn" id="three">3</button>
                <button class="btn" id="addition">+</button>

            </div>
            <div class="row4">
                <button class="btn" id="zero">0</button>
                <button class="btn" id="point">.</button>
                <button class="btn" id="equals">=</button>

            </div>
        </div>
    </div>

   







    <script src="script.js"></script>
    
</body>
</html>
